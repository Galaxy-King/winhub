name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WinHUB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall core modules server_debian.py server_prod.py migrations
      - name: Security regression tests
        run: python -m unittest discover -s tests -v
      - name: Bash syntax check
        run: |
          for script in deploy/*.sh deploy/debian/*.sh ../WinHUBLinuxAgent/*.sh ../WinHUBMacAgent/*.sh ../WinHUBMacAgent/pkg-scripts/*; do
            bash -n "$script"
          done
      - name: Server release contents
        run: |
          bash deploy/create_release.sh
          tar -tzf dist/winhub-v$(cat VERSION).tar.gz > "$RUNNER_TEMP/server-files.txt"
          if grep -E '(^|/)(\.git|\.env|__pycache__|WinHUBAgentWindows|WinHUBLinuxAgent|WinHUBMacAgent|WinHUB-WiKi)(/|$)' "$RUNNER_TEMP/server-files.txt"; then
            exit 1
          fi
      - name: macOS packaging contracts
        run: python -m unittest discover -s ../WinHUBMacAgent/tests -v

  linux-agent-native-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Linux agent
        run: dotnet build WinHUBLinuxAgent/WinHUBLinuxAgent.csproj -c Release -p:PublishAot=false
      - name: Verify Linux filesystem, journal and process cleanup
        run: dotnet WinHUBLinuxAgent/bin/Release/net8.0/WinHUBLinuxAgent.dll --self-test

  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Windows agent
        run: dotnet build WinHUBAgentWindows\WinHUBAgentWindows.csproj -c Release
      - name: Verify Windows production security contract
        run: dotnet WinHUBAgentWindows\bin\Release\net8.0-windows\WinHUBAgent.dll --self-test
      - name: Build shared Unix agent code
        run: dotnet build WinHUBLinuxAgent\WinHUBLinuxAgent.csproj -c Release -p:PublishAot=false
      - name: Verify Linux agent protocol contract
        run: dotnet WinHUBLinuxAgent\bin\Release\net8.0\WinHUBLinuxAgent.dll --self-test
      - name: Build macOS agent managed validation target
        working-directory: WinHUBMacAgent
        run: dotnet build WinHUBMacAgent.csproj -c Release -p:PublishAot=false -p:RuntimeIdentifier=win-x64 -p:SelfContained=false
      - name: Verify macOS agent protocol contract
        run: dotnet WinHUBMacAgent\bin\Release\net10.0\win-x64\WinHUBMacAgent.dll --self-test
      - name: PowerShell parser check
        shell: pwsh
        run: |
          Get-ChildItem WinHUBAgentWindows\*.ps1, WinHUB\core\validate_powershell.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
